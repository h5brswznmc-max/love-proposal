<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sənə Bir Məktub ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#090909,#2b001f,#000);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-y:auto;
color:white;
padding:30px 0;
}

.card{
width:90%;
max-width:900px;
margin:30px 0;
padding:45px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
box-shadow:0 0 40px rgba(255,0,100,.2);
animation:show 2s;
}

h1{
text-align:center;
font-size:55px;
color:#ff4d8d;
margin-bottom:35px;
}

#text{
font-size:22px;
line-height:2;
min-height:350px;
white-space:pre-line;
}

button{
margin-top:40px;
padding:18px 45px;
border:none;
border-radius:50px;
background:#ff2d75;
color:white;
font-size:20px;
cursor:pointer;
transition:.4s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 30px #ff2d75;
}

@keyframes show{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="card">

<h1>İnci ❤️</h1>

<div id="text"></div>

<center>

<button onclick="location.href='proposal.html'">

Son Sürprizə Keç 💍

</button>

</center>

</div>

<script>

const message = `

İnci...

Bəzən insan bir nəfərlə tanış olur və bütün həyatı dəyişir.

Mənim üçün o insan sənsən.

08.04.2026 tarixindən bəri hər günüm daha gözəl keçdi.

Sənin gülüşün məni xoşbəxt edir.

Sənin səsin mənə rahatlıq verir.

Sənin varlığın isə mənim üçün dünyanın ən qiymətli hədiyyəsidir.

Mən gələcəkdə də bütün xəyallarımı səninlə qurmaq istəyirəm.

Birlikdə gülmək...

Birlikdə gəzmək...

Birlikdə yaşlanmaq...

Və hər gün sənə

"Səni çox sevirəm"

demək istəyirəm.

Bu məktubun sonunda sənə ürəyimin ən dərin yerindən gələn bir sual verəcəyəm...

❤️

— Sübhan

`;

let i = 0;

function type(){

if(i < message.length){

document.getElementById("text").innerHTML += message.charAt(i);

i++;

setTimeout(type,45);

}

}

type();

</script>

</body>
</html>
