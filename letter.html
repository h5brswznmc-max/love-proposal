<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İnci ❤️</title>

<link rel="stylesheet" href="style.css">

<style>

body{

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

background:
radial-gradient(circle,#2a0038,#090909);

padding:20px;

overflow:hidden;

}

.letter{

width:90%;
max-width:850px;

padding:45px;

border-radius:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

color:white;

box-shadow:0 0 50px rgba(255,0,120,.2);

animation:show 1.5s;

}

h1{

text-align:center;

color:#ff4d88;

font-size:48px;

margin-bottom:30px;

}

#typing{

font-size:22px;

line-height:2;

min-height:320px;

white-space:pre-wrap;

}

button{

margin-top:35px;

width:100%;

padding:18px;

border:none;

border-radius:50px;

font-size:20px;

background:linear-gradient(45deg,#ff2d75,#ff5fa2);

color:white;

cursor:pointer;

display:none;

}

button:hover{

transform:scale(1.04);

}

@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="letter">

<h1>Əziz İnci ❤️</h1>

<div id="typing"></div>

<button id="next">

Sənin cavabını verməyin vaxtıdır ❤️

</button>

</div>

<script>

const text=`

Əziz İnci...

Səni tanıdığım gündən etibarən həyatım tamam dəyişdi.

Sənin gülüşün mənim ən sevdiyim mənzərədir.

Sənin səmimiyyətin isə mənə hər gün xoşbəxtlik verir.

Bəzən insan çox şey axtarır...

Amma xoşbəxtlik bəzən bir insanın gülüşündə gizlənir.

Mən o xoşbəxtliyi səndə tapdım.

Bu gün sənə ürəyimdə olan ən səmimi sualı vermək istəyirəm...

`;

const typing=document.getElementById("typing");

const btn=document.getElementById("next");

let i=0;

function write(){

if(i<text.length){

typing.innerHTML+=text.charAt(i);

i++;

setTimeout(write,40);

}else{

btn.style.display="block";

}

}

write();

btn.onclick=()=>{

location.href="proposal.html";

}

</script>

</body>

</html>
